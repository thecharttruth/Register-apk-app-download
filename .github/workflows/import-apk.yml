name: Import latest register APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-apk.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download current register build
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://sdmntprcentralus.oaiusercontent.com/files/00000000-ca28-81f5-a84e-e8147cf30290/raw?se=2026-09-28T17%3A29%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=242148ae-9596-551c-b0fa-a6b07b2a3383&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T12%3A05%3A28Z&ske=2026-09-29T12%3A05%3A28Z&sks=b&skv=2026-02-06&sig=2kak5/9L2qcjaFsZLWQDOssnV8M1ttT0TIkn3FHqdeg%3D" -o /tmp/register.zip
          mkdir -p /tmp/register-unpacked
          unzip -o /tmp/register.zip -d /tmp/register-unpacked
          cp /tmp/register-unpacked/app-debug.apk restaurant-register.apk
          test -s restaurant-register.apk
      - name: Publish APK and remove one-time importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add restaurant-register.apk
          git rm .github/workflows/import-apk.yml
          git commit -m "Publish latest Restaurant Register APK"
          git push
