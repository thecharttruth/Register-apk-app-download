name: Publish native-scanner Owner APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-owner-native-scanner.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download Owner APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://sdmntprwestus.oaiusercontent.com/files/00000000-a1dc-8230-a909-e43a3aa09222/raw?se=2026-09-29T14%3A10%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=ed80b197-de4f-55d8-9ef7-04e6a13be28b&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T02%3A22%3A36Z&ske=2026-09-30T02%3A22%3A36Z&sks=b&skv=2026-02-06&sig=eH23XvX07mgvDb5/AApDBUAjhuzJiv6R%2BctRGEs8MsE%3D" -o /tmp/owner.zip
          rm -rf /tmp/owner-unpacked
          mkdir -p /tmp/owner-unpacked
          unzip -o /tmp/owner.zip -d /tmp/owner-unpacked
          cp /tmp/owner-unpacked/app-debug.apk restaurant-owner.apk
          test -s restaurant-owner.apk
      - name: Publish Owner APK and remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add restaurant-owner.apk
          git rm .github/workflows/publish-owner-native-scanner.yml
          git commit -m "Publish native QR scanner Owner APK"
          git push
