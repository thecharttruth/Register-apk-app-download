name: Publish Owner home-image build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-owner-home-image.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download Owner APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://sdmntprcacentral.oaiusercontent.com/files/00000000-d6ec-820d-84ff-26ad6a9e570f/raw?se=2026-09-29T16%3A47%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=3e7f6c20-84ae-5c94-a061-8786da699bee&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T02%3A27%3A52Z&ske=2026-09-30T02%3A27%3A52Z&sks=b&skv=2026-02-06&sig=1OxiPtm9AafRAFtDKmuB0T08ZvMSB/J3WmSAJFc3bqQ%3D" -o /tmp/owner.zip
          rm -rf /tmp/owner-unpacked
          mkdir -p /tmp/owner-unpacked
          unzip -o /tmp/owner.zip -d /tmp/owner-unpacked
          cp /tmp/owner-unpacked/app-debug.apk restaurant-owner.apk
          test -s restaurant-owner.apk
      - name: Publish Owner APK and remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add restaurant-owner.apk
          git rm .github/workflows/publish-owner-home-image.yml
          git commit -m "Publish Owner home menu image preview build"
          git push
