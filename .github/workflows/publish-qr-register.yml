name: Publish QR Register APK
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-qr-register.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download Register APK
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://sdmntprcentralus.oaiusercontent.com/files/00000000-e778-81f5-9fa4-5f565efacfcc/raw?se=2026-09-29T13%3A14%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=5c9fc8e7-5cf7-5cf1-a2aa-d5d2d772d032&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T02%3A20%3A14Z&ske=2026-09-30T02%3A20%3A14Z&sks=b&skv=2026-02-06&sig=ui0km2RVIuDW9t9M%2BJD0piRllN6ztIctLsUTLzp/HuQ%3D" -o /tmp/register.zip
          mkdir -p /tmp/register-unpacked
          unzip -o /tmp/register.zip -d /tmp/register-unpacked
          cp /tmp/register-unpacked/app-debug.apk restaurant-register.apk
          test -s restaurant-register.apk
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add restaurant-register.apk
          git rm .github/workflows/publish-qr-register.yml
          git commit -m "Publish QR pairing Register APK"
          git push
