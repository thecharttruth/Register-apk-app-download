name: Publish stable test register APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-stable-apk.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download stable-signed register build
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://sdmntprwestus3.oaiusercontent.com/files/00000000-4750-81fd-a8fc-91bcf3c9e0f9/raw?se=2026-09-28T17%3A50%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=419f0098-e69e-5e0f-934c-19fb0829ec21&skoid=2d2fbb03-9efb-4ad0-a91c-1db2f5a47997&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T00%3A25%3A18Z&ske=2026-09-29T00%3A25%3A18Z&sks=b&skv=2026-02-06&sig=4kWZkF/iHsGw54oprVLJgwZfkfhM7Bf6QG9ZKR9qZNY%3D" -o /tmp/register.zip
          rm -rf /tmp/register-unpacked
          mkdir -p /tmp/register-unpacked
          unzip -o /tmp/register.zip -d /tmp/register-unpacked
          cp /tmp/register-unpacked/app-debug.apk restaurant-register.apk
          test -s restaurant-register.apk
      - name: Publish APK and remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add restaurant-register.apk
          git rm .github/workflows/publish-stable-apk.yml
          git commit -m "Publish stable-signed Restaurant Register test APK"
          git push
