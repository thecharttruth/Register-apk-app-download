name: Publish QR Owner APK
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-qr-owner.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download Owner APK
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://sdmntprcentralus.oaiusercontent.com/files/00000000-bee8-81f5-b082-fa822a6494da/raw?se=2026-09-29T13%3A14%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=bde8ee90-140d-548c-a2f3-5b05730d2129&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T13%3A06%3A21Z&ske=2026-09-30T13%3A06%3A21Z&sks=b&skv=2026-02-06&sig=YJW3m%2BVSwxWUS40MyAZ4TxXMusq8%2BtPsIZCnmkfPPco%3D" -o /tmp/owner.zip
          mkdir -p /tmp/owner-unpacked
          unzip -o /tmp/owner.zip -d /tmp/owner-unpacked
          cp /tmp/owner-unpacked/app-debug.apk restaurant-owner.apk
          test -s restaurant-owner.apk
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add restaurant-owner.apk
          git rm .github/workflows/publish-qr-owner.yml
          git commit -m "Publish QR pairing Owner APK"
          git push
