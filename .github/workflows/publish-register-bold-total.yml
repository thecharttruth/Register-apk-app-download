name: Publish bold cash total Register APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-register-bold-total.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download Register APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://sdmntprcentralus.oaiusercontent.com/files/00000000-bd40-81f5-8e16-cf64a153759b/raw?se=2026-09-29T16%3A09%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=3d80d011-fe7c-5b0a-9ffa-411efa4d184f&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T02%3A20%3A22Z&ske=2026-09-30T02%3A20%3A22Z&sks=b&skv=2026-02-06&sig=OiNuX/NnDfPL4dUchgHqvUCwNcGgTftQBdf1RYfc5Ns%3D" -o /tmp/register.zip
          rm -rf /tmp/register-unpacked
          mkdir -p /tmp/register-unpacked
          unzip -o /tmp/register.zip -d /tmp/register-unpacked
          cp /tmp/register-unpacked/app-debug.apk restaurant-register.apk
          test -s restaurant-register.apk
      - name: Publish Register APK and remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add restaurant-register.apk
          git rm .github/workflows/publish-register-bold-total.yml
          git commit -m "Publish bold daily cash total Register APK"
          git push
