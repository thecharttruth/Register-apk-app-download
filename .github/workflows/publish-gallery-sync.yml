name: Publish slideshow gallery sync builds

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-gallery-sync.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download latest APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://sdmntprwestus.oaiusercontent.com/files/00000000-1cc4-8230-a454-e66c61c5b55e/raw?se=2026-09-29T16%3A30%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=73e0f17b-6ec2-5788-ad84-06ed06a421d2&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T13%3A07%3A14Z&ske=2026-09-30T13%3A07%3A14Z&sks=b&skv=2026-02-06&sig=c%2Bek78PYb9xHpOarI92/UqKnT/qXSM3XKDGGOrdwb8s%3D" -o /tmp/register.zip
          curl --fail --location --retry 3 "https://sdmntpreastus.oaiusercontent.com/files/00000000-f008-81f9-8310-12fbbc01dd76/raw?se=2026-09-29T16%3A31%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=2d76054f-0892-58ba-b5ba-b490db23b2f3&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T13%3A56%3A37Z&ske=2026-09-30T13%3A56%3A37Z&sks=b&skv=2026-02-06&sig=hIXikUAnknywvOwubfHrRG4wdK2oQdD362X39NFZ3Ic%3D" -o /tmp/owner.zip
          rm -rf /tmp/register-unpacked /tmp/owner-unpacked
          mkdir -p /tmp/register-unpacked /tmp/owner-unpacked
          unzip -o /tmp/register.zip -d /tmp/register-unpacked
          unzip -o /tmp/owner.zip -d /tmp/owner-unpacked
          cp /tmp/register-unpacked/app-debug.apk restaurant-register.apk
          cp /tmp/owner-unpacked/app-debug.apk restaurant-owner.apk
          test -s restaurant-register.apk
          test -s restaurant-owner.apk
      - name: Publish APKs and remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add restaurant-register.apk restaurant-owner.apk
          git rm .github/workflows/publish-gallery-sync.yml
          git commit -m "Publish slideshow gallery sync builds"
          git push
