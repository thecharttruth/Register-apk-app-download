name: Publish verified stable-signed register APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-verified-apk.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download verified register build
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://sdmntprcentralus.oaiusercontent.com/files/00000000-a600-81f5-a969-8f67a4a19878/raw?se=2026-09-29T12%3A08%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=d2e69a21-2753-59b2-8321-c461cf65560c&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T02%3A27%3A24Z&ske=2026-09-30T02%3A27%3A24Z&sks=b&skv=2026-02-06&sig=UMLW7705iQ0kZFY3cWyPV6IvUmzBlvtp6olaaiBjBOQ%3D" -o /tmp/register.zip
          rm -rf /tmp/register-unpacked
          mkdir -p /tmp/register-unpacked
          unzip -o /tmp/register.zip -d /tmp/register-unpacked
          cp /tmp/register-unpacked/app-debug.apk restaurant-register.apk
          test -s restaurant-register.apk
      - name: Publish APK and remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add restaurant-register.apk
          git rm .github/workflows/publish-verified-apk.yml
          git commit -m "Publish verified stable-signed Restaurant Register APK"
          git push
