name: Publish native QR Owner APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-owner-native-qr.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download Owner APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://sdmntprcentralus.oaiusercontent.com/files/00000000-8b24-81f5-91fb-a26c3642c181/raw?se=2026-09-29T13%3A56%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=2d50511d-5b0a-53cb-8b18-e32bb7b4c1e9&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T13%3A07%3A13Z&ske=2026-09-30T13%3A07%3A13Z&sks=b&skv=2026-02-06&sig=9OvNPfqa6yZ7lr2eiYDhmf5TTqe37npXnCghTR4KV0Y%3D" -o /tmp/owner.zip
          rm -rf /tmp/owner-unpacked
          mkdir -p /tmp/owner-unpacked
          unzip -o /tmp/owner.zip -d /tmp/owner-unpacked
          cp /tmp/owner-unpacked/app-debug.apk restaurant-owner.apk
          test -s restaurant-owner.apk
      - name: Publish and remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add restaurant-owner.apk
          git rm .github/workflows/publish-owner-native-qr.yml
          git commit -m "Publish Owner APK with native QR scanner"
          git push
