name: Publish latest register APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-latest-apk.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download latest register build
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://sdmntprcentralus.oaiusercontent.com/files/00000000-ac78-81f5-9ffe-97afcd5c1351/raw?se=2026-09-29T11%3A51%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=d3c9e0ae-b716-5f16-ad20-f2c7f6250dd5&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T02%3A27%3A36Z&ske=2026-09-30T02%3A27%3A36Z&sks=b&skv=2026-02-06&sig=f1q3ajcgONTdQ3ervaIkXOSKZiuMqQ0NzsmAL6eyMZM%3D" -o /tmp/register.zip
          rm -rf /tmp/register-unpacked
          mkdir -p /tmp/register-unpacked
          unzip -o /tmp/register.zip -d /tmp/register-unpacked
          cp /tmp/register-unpacked/app-debug.apk restaurant-register.apk
          test -s restaurant-register.apk
      - name: Publish APK and remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add restaurant-register.apk
          git rm .github/workflows/publish-latest-apk.yml
          git commit -m "Publish native-plugin-enabled Restaurant Register APK"
          git push
