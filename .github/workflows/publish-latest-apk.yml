name: Publish latest register APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-latest-apk.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download latest register build
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://sdmntprwestus3.oaiusercontent.com/files/00000000-2744-81fd-98d6-18c53ae7c82d/raw?se=2026-09-28T21%3A01%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=5a4475cb-2bec-5610-8fa3-691189ff2210&skoid=2d2fbb03-9efb-4ad0-a91c-1db2f5a47997&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T20%3A56%3A30Z&ske=2026-09-29T20%3A56%3A30Z&sks=b&skv=2026-02-06&sig=/FqgDccxRSjIeVhCmkn1eKmH39y30QDJSAvYgiml8No%3D" -o /tmp/register.zip
          rm -rf /tmp/register-unpacked
          mkdir -p /tmp/register-unpacked
          unzip -o /tmp/register.zip -d /tmp/register-unpacked
          cp /tmp/register-unpacked/app-debug.apk restaurant-register.apk
          test -s restaurant-register.apk
      - name: Publish APK and remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add restaurant-register.apk
          git rm .github/workflows/publish-latest-apk.yml
          git commit -m "Publish latest Restaurant Register APK"
          git push
