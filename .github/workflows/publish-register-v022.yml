name: Publish Register 0.2.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-register-v022.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download Register 0.2.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://sdmntprwestus3.oaiusercontent.com/files/00000000-f20c-81fd-bc63-db4bf784f580/raw?se=2026-09-29T17%3A43%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=b159d29e-833c-5738-9c9c-c1c2446fb576&skoid=2d2fbb03-9efb-4ad0-a91c-1db2f5a47997&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T14%3A40%3A08Z&ske=2026-09-30T14%3A40%3A08Z&sks=b&skv=2026-02-06&sig=gZ3UAgpD9F3mpM5v9THNhMlkV92u5gz9v47h4LN5nZU%3D" -o /tmp/register.zip
          rm -rf /tmp/register-unpacked
          mkdir -p /tmp/register-unpacked
          unzip -o /tmp/register.zip -d /tmp/register-unpacked
          cp /tmp/register-unpacked/app-debug.apk restaurant-register-v0.2.2.apk
          cp restaurant-register-v0.2.2.apk restaurant-register.apk
          test -s restaurant-register.apk
      - name: Publish Register and remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add restaurant-register.apk restaurant-register-v0.2.2.apk
          git rm .github/workflows/publish-register-v022.yml
          git commit -m "Publish Register Android version 0.2.2"
          git push
